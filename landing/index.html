<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эверест Мед - Запись на услуги</title>
  <meta name="description" content="Онлайн-запись на услуги косметологической клиники Эверест Мед.">
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #151515;
      --gold: #c7a66a;
      --gold-soft: #e0c78f;
      --text: #f5f5f5;
      --muted: #b8b8b8;
      --error: #ff6b6b;
      --ok: #7ee081;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid rgba(199, 166, 106, 0.35);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--gold-soft);
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    form { display: grid; gap: 12px; }

    label {
      font-size: 14px;
      color: var(--gold-soft);
    }

    input, select, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(199, 166, 106, 0.35);
      background: #111;
      color: var(--text);
      padding: 12px;
      font-size: 15px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(199, 166, 106, 0.2);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(90deg, #ad8a4d, #d7ba7b);
      color: #181818;
      border: none;
      transition: transform 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      min-height: 20px;
      margin-top: 4px;
      font-size: 14px;
    }
    .status.error { color: var(--error); }
    .status.ok { color: var(--ok); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Онлайн-запись в Эверест Мед</h1>
    <p>Оставьте контакты, и администратор подтвердит запись на выбранную услугу.</p>

    <form id="bookingForm">
      <div>
        <label for="name">Имя</label>
        <input id="name" name="name" type="text" required minlength="2" maxlength="80">
      </div>

      <div>
        <label for="phone">Телефон</label>
        <input id="phone" name="phone" type="tel" required placeholder="+7 (___) ___-__-__">
      </div>

      <div>
        <label for="doctor">Врач</label>
        <select id="doctor" name="doctor" required>
          <option value="">Загрузка врачей...</option>
        </select>
      </div>

      <div>
        <label for="service">Услуга</label>
        <select id="service" name="service" required disabled>
          <option value="">Загрузка услуг...</option>
        </select>
      </div>

      <div>
        <label for="date">Дата</label>
        <input id="date" name="date" type="date" required>
      </div>

      <div>
        <label for="time">Время</label>
        <select id="time" name="time" required disabled>
          <option value="">Сначала выберите врача, услугу и дату</option>
        </select>
      </div>

      <div>
        <label for="comment">Комментарий (необязательно)</label>
        <input id="comment" name="comment" type="text" maxlength="500" placeholder="Пожелания или вопросы">
      </div>

      <button id="submitBtn" type="submit">Записаться</button>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="/config.js"></script>
  <script>
    const YANDEX_METRIKA_ID = window.APP_CONFIG?.YANDEX_METRIKA_ID || "";

    const doctorSelect = document.getElementById("doctor");
    const serviceSelect = document.getElementById("service");
    const dateInput = document.getElementById("date");
    const timeSelect = document.getElementById("time");
    const submitBtn = document.getElementById("submitBtn");

    function getUTMParams() {
      const params = new URLSearchParams(window.location.search);
      const keys = ["source", "medium", "campaign", "content", "term"];
      const utm = {};

      keys.forEach((key) => {
        const current = params.get("utm_" + key);
        if (current) localStorage.setItem("utm_" + key, current);
        utm[key] = localStorage.getItem("utm_" + key) || "direct";
      });

      return utm;
    }

    function normalizePhone(phone) {
      return phone.replace(/[^\d+]/g, "").trim();
    }

    function setStatus(message, type) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = "status " + (type || "");
    }

    function setSelectOptions(select, placeholder, items, renderOption) {
      select.innerHTML = "";
      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = placeholder;
      select.appendChild(defaultOption);

      items.forEach((item) => {
        const option = document.createElement("option");
        renderOption(option, item);
        select.appendChild(option);
      });
    }

    async function loadDoctors() {
      const response = await fetch("/api/doctors");
      if (!response.ok) {
        throw new Error("Не удалось загрузить список врачей");
      }

      const doctors = await response.json();
      setSelectOptions(doctorSelect, "Выберите врача", doctors, (option, doctor) => {
        option.value = String(doctor.id);
        option.textContent = doctor.name + " (" + doctor.specialization + ")";
      });
    }

    async function loadServices() {
      const response = await fetch("/api/services");
      if (!response.ok) {
        throw new Error("Не удалось загрузить список услуг");
      }

      const services = await response.json();
      setSelectOptions(serviceSelect, "Выберите услугу", services, (option, service) => {
        option.value = String(service.id);
        option.textContent = service.title + " (" + service.durationMinutes + " мин.)";
      });
      serviceSelect.disabled = false;
    }

    async function loadSlots() {
      const doctorId = doctorSelect.value;
      const serviceId = serviceSelect.value;
      const date = dateInput.value;

      if (!doctorId || !serviceId || !date) {
        setSelectOptions(timeSelect, "Сначала выберите врача, услугу и дату", [], () => {});
        timeSelect.disabled = true;
        return;
      }

      timeSelect.disabled = true;
      setSelectOptions(timeSelect, "Загрузка свободных слотов...", [], () => {});

      const params = new URLSearchParams({
        doctorId,
        serviceId,
        date,
      });

      const response = await fetch("/api/slots?" + params.toString());
      if (!response.ok) {
        throw new Error("Не удалось загрузить свободные слоты");
      }

      const data = await response.json();
      const slots = data.slots || [];

      if (slots.length === 0) {
        setSelectOptions(timeSelect, "Нет свободных слотов на эту дату", [], () => {});
        timeSelect.disabled = true;
        return;
      }

      setSelectOptions(timeSelect, "Выберите время", slots, (option, slot) => {
        option.value = slot.time;
        option.textContent = slot.time;
      });
      timeSelect.disabled = false;
    }

    async function initBookingForm() {
      const today = new Date().toISOString().slice(0, 10);
      dateInput.min = today;

      try {
        await Promise.all([loadDoctors(), loadServices()]);
      } catch (error) {
        setStatus(error.message || "Ошибка загрузки данных для записи.", "error");
        submitBtn.disabled = true;
      }
    }

    doctorSelect.addEventListener("change", () => {
      void loadSlots().catch((error) => setStatus(error.message, "error"));
    });

    serviceSelect.addEventListener("change", () => {
      void loadSlots().catch((error) => setStatus(error.message, "error"));
    });

    dateInput.addEventListener("change", () => {
      void loadSlots().catch((error) => setStatus(error.message, "error"));
    });

    document.getElementById("bookingForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const form = event.currentTarget;
      const utm = getUTMParams();

      const payload = {
        clientName: form.name.value.trim(),
        phone: normalizePhone(form.phone.value),
        doctorId: Number(form.doctor.value),
        serviceId: Number(form.service.value),
        date: form.date.value,
        time: form.time.value,
        comment: form.comment.value.trim() || undefined,
        utmSource: utm.source,
        utmMedium: utm.medium,
        utmCampaign: utm.campaign,
        utmContent: utm.content,
        utmTerm: utm.term,
      };

      if (
        !payload.clientName ||
        !payload.phone ||
        !payload.doctorId ||
        !payload.serviceId ||
        !payload.date ||
        !payload.time
      ) {
        setStatus("Проверьте заполнение всех полей формы.", "error");
        return;
      }

      submitBtn.disabled = true;
      setStatus("Отправляем заявку...", "");

      try {
        const response = await fetch("/api/appointments", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 409) {
          setStatus("Этот слот уже занят. Выберите другое время.", "error");
          await loadSlots();
          return;
        }

        if (!response.ok) {
          throw new Error(data.error || "Ошибка создания записи");
        }

        if (window.ym && YANDEX_METRIKA_ID) {
          window.ym(Number(YANDEX_METRIKA_ID), "reachGoal", "booking_success");
        }

        form.reset();
        dateInput.min = new Date().toISOString().slice(0, 10);
        timeSelect.disabled = true;
        setSelectOptions(timeSelect, "Сначала выберите врача, услугу и дату", [], () => {});
        setStatus("Спасибо! Запись создана. Администратор подтвердит её в ближайшее время.", "ok");
      } catch (error) {
        setStatus(error.message || "Ошибка отправки. Попробуйте снова через минуту.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    void initBookingForm();
  </script>

  <!-- Yandex.Metrika counter -->
  <script type="text/javascript">
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();
    for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

    if (YANDEX_METRIKA_ID) {
      ym(Number(YANDEX_METRIKA_ID), "init", {
        clickmap: true,
        trackLinks: true,
        accurateTrackBounce: true,
        webvisor: true
      });
    }
  </script>
  <noscript><div><img id="ymNoScriptImage" src="https://mc.yandex.ru/watch/" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
  <script>
    (function () {
      if (!YANDEX_METRIKA_ID) return;
      var img = document.getElementById("ymNoScriptImage");
      if (img) img.src = "https://mc.yandex.ru/watch/" + YANDEX_METRIKA_ID;
    })();
  </script>
  <!-- /Yandex.Metrika counter -->
</body>
</html>
