services:
  db:
    image: mysql:8.0
    container_name: everest-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - everest-net

  crm:
    build: ./crm
    container_name: everest-crm
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    environment:
      TZ: ${TZ}
    ports:
      - "8082:80"
    volumes:
      - ./salesmancrm:/var/www/html
    networks:
      - everest-net
      - nginx-proxy-manager_default

  landing:
    build: ./landing
    container_name: everest-landing
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      booking-api:
        condition: service_healthy
    ports:
      - "8081:80"
    networks:
      - everest-net
      - nginx-proxy-manager_default

  booking-db:
    image: postgres:16
    container_name: everest-booking-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${BOOKING_POSTGRES_DB:-everest_booking}
      POSTGRES_USER: ${BOOKING_POSTGRES_USER:-booking_user}
      POSTGRES_PASSWORD: ${BOOKING_POSTGRES_PASSWORD}
    volumes:
      - booking_pg_data:/var/lib/postgresql/data
    networks:
      - everest-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_POSTGRES_USER:-booking_user} -d ${BOOKING_POSTGRES_DB:-everest_booking}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  booking-api:
    build: ./online-booking-api
    container_name: everest-booking-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      booking-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${BOOKING_DATABASE_URL}
      PORT: ${BOOKING_PORT:-3000}
      N8N_BOOKING_WEBHOOK: ${N8N_BOOKING_WEBHOOK}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      PENDING_EXPIRY_MINUTES: ${PENDING_EXPIRY_MINUTES:-15}
    networks:
      - everest-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
  booking_pg_data:

networks:
  everest-net:
    name: everest-net
    driver: bridge
  nginx-proxy-manager_default:
    external: true
